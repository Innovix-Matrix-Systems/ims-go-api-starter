openapi: 3.0.3

info:
  title: IMS Go API Starter
  version: 1.0.0
  description: |
    Canonical HTTP contract for the IMS Go API Starter. It is the source of
    truth for the API surface: success envelopes, pagination, the
    RFC 9457 `application/problem+json` error model, and the bearer security scheme.

    ## Conventions
    - Success responses are wrapped: `{"data": ...}` for resources, `{"message": ...}` for
      message-only results, and `204 No Content` (empty body) for deletions/logout.
    - List endpoints return `{"data": [...], "links": {...}, "meta": {...}}`.
    - Every error is `application/problem+json` (RFC 9457) carrying `type`, `title`,
      `status`, `detail`, `error_code`, `timestamp`; `trace_id` (5xx), `errors` (422),
      `meta` (feature limits) and `retry_after` (429) appear when applicable.
    - Timestamps are RFC 3339 UTC. Money is in minor units (paisa), currency `BDT`.
    - IDs are 64-bit integers.

    ## Tenancy & impersonation
    Authenticated routes are resolved to a tenant/branch from the caller's identity.
    Impersonators may send the optional headers `X-Acting-Tenant` and `X-Acting-Branch`;
    sends on tenant-resolved write routes without acting headers are rejected with 403.
    Request locale is negotiated from `Accept-Language` (`en`, `bn`).

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: System
    description: Service metadata and transport demo endpoints.
  - name: Auth
    description: Login, OTP verification and logout.
  - name: Users
    description: Tenant users, profiles and background import/export.
  - name: Branches
  - name: Roles & Permissions
  - name: Tenants
  - name: Billing
    description: Packages, subscriptions, payments and manual approvals.
  - name: Notifications
  - name: Files
  - name: Data Processing
  - name: Settings
    description: Grouped settings with global and tenant targets.
  - name: Feature Flags
    description: Boolean feature flags with global, tenant and user targets.
  - name: Dev
    description: Developer dashboard identity and (later) telemetry/queue admin API.
  - name: Ops
    description: Liveness, health, docs and metrics.

security:
  - bearerAuth: []

# Shared response objects, aliased throughout `paths`. Kept here (before use)
# because YAML aliases must reference an anchor defined earlier in the document.
x-shared-responses:
  badRequest: &badRequest
    description: Malformed request.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  unauthorized: &unauthorized
    description: Missing, invalid or expired bearer token.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  forbidden: &forbidden
    description: Authenticated but not permitted, or tenant context missing.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  notFound: &notFound
    description: Resource not found.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  paymentRequired: &paymentRequired
    description: Feature not available or usage limit exceeded for the plan.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  conflict: &conflict
    description: Conflicting state.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  validationFailed: &validationFailed
    description: Validation failed; `errors` carries field messages.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  requestTooLarge: &requestTooLarge
    description: Payload exceeds the configured limit.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  unsupportedMedia: &unsupportedMedia
    description: Unsupported request content type.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  tooManyRequests: &tooManyRequests
    description: Rate limit exceeded; see `retry_after`.
    headers:
      Retry-After:
        schema: {type: integer}
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  serviceUnavailable: &serviceUnavailable
    description: A dependency or gateway is unavailable.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  internalError: &internalError
    description: Unexpected error; the response carries a `trace_id`.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}

paths:
  /up:
    get:
      tags: [Ops]
      summary: Liveness probe
      operationId: liveness
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}

  /api/health:
    get:
      tags: [Ops]
      summary: Health checks
      operationId: health
      security: []
      parameters:
        - name: fresh
          in: query
          description: Run checks live instead of returning the cached result.
          schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: Health results (cached up to the configured TTL).
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResults"}

  /docs:
    get:
      tags: [Ops]
      summary: Scalar API reference UI (config-gated)
      operationId: docsUI
      security: []
      responses:
        "200":
          description: HTML documentation page.
          content:
            text/html:
              schema: {type: string}
        "404": *notFound

  /docs/openapi.yaml:
    get:
      tags: [Ops]
      summary: Raw OpenAPI document (config-gated)
      operationId: docsSpec
      security: []
      responses:
        "200":
          description: The embedded OpenAPI specification.
          content:
            application/yaml:
              schema: {type: string}
        "404": *notFound

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics (config-gated)
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: {type: string}
        "404": *notFound

  /api/v1/system/info:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [System]
      summary: Service information
      operationId: systemInfo
      security: []
      responses:
        "200":
          description: Build/runtime information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemInfoEnvelope"}

  /api/v1/system/echo:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [System]
      summary: Echo a message (validation demo)
      operationId: systemEcho
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 2, maxLength: 255}
      responses:
        "200":
          description: The trimmed message and its length.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EchoEnvelope"}
        "422": *validationFailed

  /api/v1/login:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: |
            `status` is `AUTH_SUCCESS` with a `token`, or `OTP_REQUIRED` with a null token
            when OTP is enabled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginEnvelope"}
        "401": *unauthorized
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/verify-otp:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Complete login by verifying an OTP
      operationId: authVerifyOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyOTPRequest"}
      responses:
        "200":
          description: Login result with an issued token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginEnvelope"}
        "401": *unauthorized
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password reset link
      description: >-
        Always answers 200 with the same message, whether or not the e-mail belongs to an account
        (no account enumeration). At most one mail per address per minute.
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: The token works once. Every session of the account is signed out.
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email, maxLength: 255}
                token: {type: string, maxLength: 200}
                password: {type: string, minLength: 8, maxLength: 72}
                password_confirmation: {type: string}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/email/verification-notification:
    post:
      tags: [Auth]
      summary: Send (again) the e-mail verification link
      description: Same answer for every address (no enumeration); at most one mail per address per minute.
      operationId: authResendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/email/verify:
    post:
      tags: [Auth]
      summary: Verify an e-mail address with the token from the verification link
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 200}
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/logout:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Revoke the token for one device
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: {type: string, maxLength: 100}
      responses:
        "204": {description: Token revoked.}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/user:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/OrderByUser"
        - $ref: "#/components/parameters/OrderDirection"
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "429": *tooManyRequests
        "500": *internalError
    post:
      tags: [Users]
      summary: Create a user in the resolved tenant
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpsertRequest"}
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "402": *paymentRequired
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/user/profile:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getUserProfile
      responses:
        "200":
          description: The caller's user record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized

  /api/v1/user/profile/update:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Update the authenticated user's profile
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: {type: string, maxLength: 100, nullable: true}
                last_name: {type: string, maxLength: 100, nullable: true}
                name: {type: string, minLength: 2, maxLength: 255, nullable: true}
                phone: {type: string, maxLength: 50, nullable: true}
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/user/profile/update-avatar:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Update a user's avatar
      description: |
        Multipart upload that replaces the avatar of the user identified by the
        required `id` form field. Updating your own avatar needs no extra
        permission; updating another user requires `user.update`.
      operationId: updateUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, avatar]
              properties:
                id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: User ID whose avatar to update.
                  example: 1
                avatar:
                  type: string
                  format: binary
                  description: Avatar image (max 5MB).
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "415": *unsupportedMedia
        "422": *validationFailed

  /api/v1/user/profile/change-password:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      operationId: changeUserProfilePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: {type: string}
                password: {type: string, minLength: 6, maxLength: 72}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/user/assign-role:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Assign roles to a user
      operationId: assignUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssignRoleRequest"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/user/change-password:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Set another user's password (admin)
      operationId: changeUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/user/switch-branch/{id}:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    patch:
      tags: [Users]
      summary: Switch a user's active branch
      operationId: switchUserBranch
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /api/v1/user/import-background:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Queue a background user import (CSV/XLSX upload)
      operationId: importUsersBackground
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The queued processing job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackgroundJobEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "413": *requestTooLarge
        "415": *unsupportedMedia
        "503": *serviceUnavailable

  /api/v1/user/export-background:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Queue a background user export
      operationId: exportUsersBackground
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportFiltersRequest"}
      responses:
        "200":
          description: The queued processing job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackgroundJobEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed
        "503": *serviceUnavailable

  /api/v1/user/import-template:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Download the CSV user-import template
      operationId: downloadUserImportTemplate
      responses:
        "200":
          description: CSV template.
          content:
            text/csv:
              schema: {type: string}
        "401": *unauthorized
        "403": *forbidden
        "503": *serviceUnavailable

  /api/v1/user/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
    patch:
      tags: [Users]
      summary: Update a user (email is immutable)
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpsertRequest"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict
        "422": *validationFailed
    delete:
      tags: [Users]
      summary: Delete (soft) a user
      operationId: deleteUser
      responses:
        "204": {description: Deleted.}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /api/v1/internal/user:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Create an internal user
      operationId: createInternalUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InternalUserUpsertRequest"}
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/internal/user/{id}:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    patch:
      tags: [Users]
      summary: Update an internal user
      operationId: updateInternalUser
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InternalUserUpsertRequest"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed
    delete:
      tags: [Users]
      summary: Delete (soft) an internal user
      operationId: deleteInternalUser
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": {description: Deleted.}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /api/v1/internal/user/export-background:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Queue a background internal user export
      operationId: exportInternalUsersBackground
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportFiltersRequest"}
      responses:
        "200":
          description: The queued processing job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackgroundJobEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed
        "503": *serviceUnavailable

  /api/v1/internal/user/import-background:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Users]
      summary: Queue a background internal user import
      operationId: importInternalUsersBackground
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The queued processing job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackgroundJobEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "413": *requestTooLarge
        "415": *unsupportedMedia
        "503": *serviceUnavailable

  /api/v1/internal/user/assign-role:
    post:
      tags: [Users]
      summary: Assign roles to an internal user
