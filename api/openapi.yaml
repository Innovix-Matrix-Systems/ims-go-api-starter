  /api/v1/billing/{gateway}/callback:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [Billing]
      summary: Payment gateway callback (public)
      description: >-
        The query string is only a hint: the payment outcome is always confirmed with the gateway.
        A payment fails only when the gateway reports it failed/cancelled; a gateway outage answers
        503 and changes nothing. Manual methods (cash, bank_transfer) do not accept callbacks.
      operationId: billingCallback
      security: []
      parameters:
        - name: gateway
          in: path
          required: true
          schema: {type: string, enum: [bkash, nagad]}
        - name: paymentID
          in: query
          required: true
          description: Gateway payment reference.
          schema: {type: string}
      responses:
        "200":
          description: Callback processed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "400": *badRequest
        "404": *notFound
        "422": *validationFailed
        "503": *serviceUnavailable

